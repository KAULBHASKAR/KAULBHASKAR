<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload critical custom fonts -->
    <link rel="preload" href="/fonts/zentry-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/robert-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/circularweb-book.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" fetchpriority="high" as="image" href="/img/intro.webp" type="image/webp">

    <!-- High-contrast inline loader styles -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #0d0d0d;
      }
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-left-color: #fbbf24; /* High contrast amber/gold */
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      .loader-title {
        color: #ffffff; /* 100% white for maximum contrast ratio */
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <title>KAULBHASKAR a Legend KAUL | Tantra, Astrology & Spiritual Guidance</title>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="spinner"></div>
        <div class="loader-title">KAULBHASKAR</div>
      </div>
    </div>

    <!-- Vite module entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
